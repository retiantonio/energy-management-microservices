spring.application.name=authentication-service
server.port=8081

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/credential_db}
spring.datasource.username=${DB_USER:credential_user}
spring.datasource.password=${DB_PASSWORD:credential_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

services.user.url=${USER_SERVICE_URL:http://localhost:8082}

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long!!}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
internal.api-key=${INTERNAL_API_KEY:very_not_secret_internal_key_wowowow}