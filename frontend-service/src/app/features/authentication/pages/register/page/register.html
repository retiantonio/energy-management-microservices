<main class="page">
  <section class="login-card" aria-labelledby="register-title">
    <app-dever-brand class="auth-brand" />
    <h1 id="register-title">Create your account</h1>
    <p class="intro">Enter your details to get started.</p>

    <form (ngSubmit)="register()">
      <label for="username">
        Username
        <span class="field-control">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-user" /></svg>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            minlength="4"
            maxlength="20"
            [(ngModel)]="username"
            required
          />
        </span>
      </label>

      <label for="password">
        Password
        <div class="password-input-wrapper field-control">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-lock" /></svg>
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            [(ngModel)]="password"
            required
          />

          <button
            class="toggle"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
          >
            <svg class="button-icon" aria-hidden="true">
              <use [attr.href]="showPassword() ? '#icon-eye-off' : '#icon-eye'" />
            </svg>
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>

      <label for="name">
        Name
        <span class="field-control">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-user" /></svg>
          <input
            id="name"
            name="name"
            type="text"
            autocomplete="name"
            minlength="5"
            maxlength="20"
            [(ngModel)]="name"
            required
          />
        </span>
      </label>

      <label for="email">
        Email
        <span class="field-control">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-mail" /></svg>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            [(ngModel)]="email"
            required
          />
        </span>
      </label>

      <label for="address">
        Address
        <span class="field-control">
          <svg class="field-icon" aria-hidden="true"><use href="#icon-map-pin" /></svg>
          <input
            id="address"
            name="address"
            type="text"
            autocomplete="street-address"
            minlength="5"
            maxlength="255"
            [(ngModel)]="address"
            required
          />
        </span>
      </label>

      @if (missingFieldsError()) {
        <p class="notice notice-error" role="alert">{{ missingFieldsError() }}</p>
      }

      @if (errorDetails(); as error) {
        <app-http-error-notice [details]="error" />
      }

      <button type="submit" [disabled]="isSubmitting()">
        <svg class="button-icon" aria-hidden="true"><use href="#icon-user-plus" /></svg>
        {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
      </button>
    </form>

    <p class="auth-switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
