<main class="page">
  <section class="login-card" aria-labelledby="login-title">
    <app-dever-brand class="auth-brand" />
    <h1>Welcome back</h1>
    <p class="intro">Sign in with your account to continue.</p>

    <form (ngSubmit)="login()">
      <label for="username">
        Username
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          placeholder="Enter your username"
          [(ngModel)]="username"
          required
        />
      </label>

      <label for="password">
        Password
        <div class="password-input-wrapper">
          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="Enter your password"
            [(ngModel)]="password"
            required
          />

          <button
            class="toggle"
            type="button"
            (click)="showPassword.set(!showPassword())"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="showPassword()"
          >
            <svg class="button-icon" aria-hidden="true">
              <use [attr.href]="showPassword() ? '#icon-eye-off' : '#icon-eye'" />
            </svg>
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </label>

      @if (missingFieldsError()) {
        <p class="notice notice-error" role="alert">{{ missingFieldsError() }}</p>
      }

      @if (errorDetails(); as error) {
        <app-http-error-notice [details]="error" />
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="auth-switch">New here? <a routerLink="/register">Create an account</a></p>
  </section>
</main>
