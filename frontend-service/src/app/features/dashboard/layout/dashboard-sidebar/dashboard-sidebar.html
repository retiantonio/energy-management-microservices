<aside class="sidebar">
  <a class="brand" routerLink="/dashboard" aria-label="Dever home">
    <app-dever-brand />
  </a>

  <p class="nav-label">Workspace</p>
  <nav aria-label="Main navigation">
    <a
      routerLink="/dashboard"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Overview
    </a>
    <a routerLink="/dashboard/devices" routerLinkActive="active">Devices</a>
    @if (isAdmin()) {
      <a routerLink="/dashboard/users" routerLinkActive="active">Users</a>
    }
  </nav>

  <div class="account">
    <div class="account-details">
      <span class="account-avatar" aria-hidden="true">
        {{ session()?.username?.charAt(0)?.toUpperCase() }}
      </span>
      <div class="account-identity">
        <strong>{{ session()?.username }}</strong>
        <span class="account-role">{{ session()?.role }}</span>
      </div>
    </div>
    <button type="button" (click)="logout()">
      <svg class="button-icon" aria-hidden="true"><use href="#icon-logout" /></svg>
      Sign out
    </button>
  </div>
</aside>
