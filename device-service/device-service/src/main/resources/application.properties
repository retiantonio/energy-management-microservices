spring.application.name=device-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/device_db}
spring.datasource.username=${DB_USER:device_user}
spring.datasource.password=${DB_PASSWORD:device_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

services.user.url=${USER_SERVICE_URL:http://localhost:8082}

internal.api-key=${INTERNAL_API_KEY:very_not_secret_internal_key_wowowow}