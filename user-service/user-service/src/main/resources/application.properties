spring.application.name=user-service
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/user_db}
spring.datasource.username=${DB_USER:user_user}
spring.datasource.password=${DB_PASSWORD:user_pass}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

services.device.url=${DEVICE_SERVICE_URL:http://localhost:8083}
services.credential.url=${AUTH_SERVICE_URL:http://localhost:8081}

internal.api-key=${INTERNAL_API_KEY:very_not_secret_internal_key_wowowow}